[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsagents"
version = "0.1.0"
description = "Agent runtime for DeepAgents with pluggable document parsing."
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents>=0.6.12",
    "fastapi>=0.116.1",
    "langchain>=1.3.11",
    "langchain-anthropic>=1.4.8",
    "langchain-core>=1.4.8",
    "langgraph>=1.2.7",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "openpyxl>=3.1,<4",
    "oracledb>=3,<4",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn>=0.35.0",
    "httpx2>=2.5.0",
]

# backend/ 作为安装根；dsagents 是一个 Python 包（含 runtime / integrations /
# skills 子包，以及两个内置 Skill 包 philipswgqimport、tecanimport，各自带
# SKILL.md / references / assets，必须随 wheel 一起打包）。
[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["dsagents*"]

[tool.setuptools.package-data]
"dsagents.skills.philipswgqimport" = ["SKILL.md", "references/*.md", "assets/*"]
"dsagents.skills.tecanimport" = ["SKILL.md", "references/*.md", "assets/*"]
