[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsagents"
version = "0.1.0"
description = "Agent runtime for DeepAgents with pluggable document parsing."
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents>=0.6.12",
    "fastapi>=0.116.1",
    "langchain>=1.3.11",
    "langchain-anthropic>=1.4.8",
    "langchain-core>=1.4.8",
    "langgraph>=1.2.7",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn>=0.35.0",
    "httpx2>=2.5.0",
]

# 扁平顶层模块：backend/ 内的 .py 直接作为顶层模块安装，
# 这样模块内部 `from hands import ...` 等绝对导入在安装后同样可用。
[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["api", "hands", "harness", "resources", "run_ledger", "tools"]
