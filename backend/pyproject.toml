[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsagents"
version = "0.1.0"
description = "Agent runtime for DeepAgents with pluggable document parsing."
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents>=0.6.12",
    "fastapi>=0.116.1",
    "langchain>=1.3.11",
    "langchain-anthropic>=1.4.8",
    "langchain-core>=1.4.8",
    "langgraph>=1.2.7",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "openpyxl>=3.1,<4",
    "oracledb>=3,<4",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn>=0.35.0",
    "httpx2>=2.5.0",
]

# backend/ 作为安装根；发行名保持 dsagents，但源码顶层入口拆成 api.py 与
# runtime/、integrations/、skills/ 三个包。两个内置 Skill 的资源目录与
# Python 运行时包分开；带连字符的 Skill 目录必须随 wheel 一起打包。
[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["api"]

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*", "integrations*", "skills*"]

[tool.setuptools.package-data]
"skills" = [
    "philips-wgq-inbound-recognition/SKILL.md",
    "tecan-import/SKILL.md",
    "tecan-import/references/*.md",
]
